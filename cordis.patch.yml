# @wwskills/dsh-web-search-providers cordis patch (DSH 0.2.x)
#
# Registers one Tavily or Baidu search provider into DSH's web seam.
#
# activeProvider: 'none' | 'tavily' | 'baidu'
#   'none'  -> nothing registers; DSH falls back to its built-in DeepSeek search.
#
# Provider selection is owned by the seam (dsh-web), not by this plugin.
# If more than one usable provider is mounted (for example DeepSeek's own search
# also has a key), calls fail with WEB_PROVIDER_AMBIGUOUS until an id is pinned:
#   - environment: DSH_WEB_SEARCH_PROVIDER=tavily
#   - or the @deepseek-ai/dsh-web row's config: searchProvider: 'tavily'
# The plugin also logs this hint on registration.

# Pin the seam to this plugin's provider. Without it, DeepSeek's built-in
# provider is always considered usable and wins (or both are, which fails with
# WEB_PROVIDER_AMBIGUOUS once a key is set here).
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: 'tavily'

- insert:
    - id: web-search-providers
      name: '@wwskills/dsh-web-search-providers'
      config:
        activeProvider: 'tavily'

        tavilyApiKey: ''
        tavilyBaseURL: 'https://api.tavily.com'
        tavilyMaxResults: 5
        tavilySearchDepth: 'basic'

        baiduApiKey: ''
        baiduMaxResults: 5

        timeoutMs: 30000
